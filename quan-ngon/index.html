<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9b6a9c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Quán Ngon Pixel</title>
<style>
:root{--cream:#fdf4e1;--cream2:#f6e6c6;--brown:#5b3a29;--brown2:#8a5a3c;--top:#9b6a9c;--ink:#3b2418}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#4a2f45;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--cream)}
#top{background:var(--top);padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;border-bottom:3px solid #6e4470}
.row{display:flex;gap:6px;align-items:center}
.pill{flex:1;display:flex;align-items:center;gap:4px;background:var(--cream);border:2px solid var(--brown);border-radius:12px;padding:2px 8px;height:30px;font-weight:800;font-size:14px;min-width:0;box-shadow:0 2px 0 #0003;white-space:nowrap;overflow:hidden}
.pill.money{flex:1.6}
.pill.star{flex:.8;padding:2px 6px}
.pill.time{flex:1.5;padding:2px 6px}
.pill b{overflow:hidden;text-overflow:ellipsis}
.pill.neg b{color:#d23}
#lvl{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#6fd36a var(--p,0%),#e7d8c0 0);border:2px solid var(--brown);box-shadow:0 2px 0 #0003}
#lvl b{width:30px;height:30px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-weight:900;font-size:15px}
#bAdd{margin-left:auto;flex:0 0 24px;background:#55c24a;color:#fff;border:2px solid #2d7a26;border-radius:7px;font-weight:900;height:22px;padding:0;line-height:16px}
#quest{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--cream);border:2px solid var(--brown);border-radius:12px;padding:4px 8px;box-shadow:0 2px 0 #0003;height:46px}
#quest .qi{font-size:22px}
#quest .qb{flex:1;min-width:0}
#qText{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qline{display:flex;align-items:center;gap:6px;margin-top:3px}
.qbar{flex:1;height:8px;background:#e7d8c0;border:1.5px solid var(--brown);border-radius:5px;overflow:hidden}
.qbar i{display:block;height:100%;background:#f2c230;width:0}
#qCount{font-size:11px;font-weight:800;white-space:nowrap}
#qReward{font-weight:900;color:#c2410c;font-size:12px;white-space:nowrap}
.sq{width:42px;height:42px;flex:0 0 42px;border-radius:10px;background:var(--cream);border:2px solid var(--brown);font-weight:900;font-size:16px;box-shadow:0 2px 0 #0003;padding:0}
.sq.on{background:#ff9a3c;color:#fff;border-color:#c2410c}
.xpwrap{display:flex;gap:6px;align-items:center}
.xpbar{flex:1;height:10px;background:#e7d8c0;border:2px solid var(--brown);border-radius:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#6fd36a;width:0;transition:width .3s}
#xpText{font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 0 #0006;white-space:nowrap}
#scene{position:relative;flex:1;min-height:140px;background:#2b1d2a;overflow:hidden}
#cv{position:absolute;touch-action:none}
.arrow{position:absolute;top:42%;width:26px;height:46px;border-radius:10px;background:var(--cream);border:2px solid var(--brown);font-size:20px;font-weight:900;padding:0;box-shadow:0 2px 0 #0004;display:none}
.arrow.show{display:block}
#prevShop{left:4px}#nextShop{right:4px}
#combo{position:absolute;right:8px;top:8px;background:#fff8e8;border:2px solid #e8833a;border-radius:12px;padding:2px 8px;font-weight:900;font-size:13px;color:#c2410c;display:none;box-shadow:0 2px 0 #0003}
#paused{position:absolute;inset:0;display:none;place-items:center;background:#0006;color:#fff;font-weight:900;font-size:22px;letter-spacing:2px}
#paused.show{display:grid}
#bFold{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:66px;height:20px;border-radius:12px 12px 0 0;background:var(--cream);border:2px solid var(--brown);border-bottom:0;color:#e0483a;font-weight:900;padding:0;font-size:12px}
#panel{background:var(--cream);border-top:3px solid var(--brown);padding:6px;display:flex;flex-direction:column;gap:6px}
#panel.fold #dishes,#panel.fold .trayrow,#panel.fold #items{display:none}
#tickets{display:flex;gap:6px;overflow-x:auto;min-height:60px;scrollbar-width:none;padding:1px}
#tickets::-webkit-scrollbar,#dishes::-webkit-scrollbar{display:none}
#tickets:empty::after{content:"Chưa có bàn nào gọi món…";color:#a8947e;font-size:13px;font-weight:700;align-self:center;padding-left:6px}
.tk{flex:0 0 auto;position:relative;width:88px;height:58px;background:#eaf6e4;border:2px solid #4a6a4a;border-radius:10px;padding:3px 5px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 0 #0002}
.tk.sel{background:#fff1b8;border-color:#e07b1a;box-shadow:0 0 0 2px #ffc94a}
.tk.busy{opacity:.7}
.tk .tb{font-weight:900;font-size:12px;color:#c2410c;text-align:left;line-height:1}
.tk .ff{position:absolute;right:5px;top:2px;font-size:12px;color:#c2410c;font-weight:900}
.tk .ti{display:flex;gap:1px}
.tk .ti img{width:19px;height:19px;border-radius:4px}
.tk .ti img.ok{background:#9be29b}
.pb{height:5px;background:#d9cbb2;border-radius:3px;overflow:hidden}
.pb i{display:block;height:100%;width:100%}
#dishes{display:flex;gap:5px;overflow-x:auto;padding:4px 2px 2px}
.dc{flex:1 0 58px;max-width:82px;height:56px;position:relative;background:#fff;border:2px solid var(--brown2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px;padding:0;box-shadow:0 2px 0 #0002}
.dc img{width:28px;height:28px}
.dc.zero{background:#f3e9da}
.dc.zero .cnt{color:#d23}
.dc .ck{position:absolute;right:-4px;top:-5px;width:22px;height:22px;border-radius:50%;background:#ff8a3c;border:2px solid #fff;font-size:11px;display:grid;place-items:center;box-shadow:0 1px 0 #0004}
.dc .cp{position:absolute;left:5px;right:5px;bottom:3px;height:4px;background:#eee;border-radius:2px;overflow:hidden;display:none}
.dc .cp i{display:block;height:100%;background:#ff8a3c;width:0}
.dc.cooking .cp{display:block}
.need{animation:pulse .7s infinite alternate;border-color:#e0483a!important}
@keyframes pulse{from{box-shadow:0 0 0 0 #ffb03c}to{box-shadow:0 0 0 3px #ffb03c}}
.trayrow{display:flex;gap:6px}
#tray{flex:1;min-height:46px;background:#fff;border:2px solid var(--brown2);border-radius:10px;display:flex;align-items:center;gap:4px;padding:3px 8px;color:#9a8a7a;font-size:13px;font-weight:700;overflow:hidden}
#tray button{background:#fff8ec;border:2px solid #e8c89a;border-radius:8px;padding:1px;width:38px;height:36px}
#tray img{width:28px;height:28px}
#tray.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#bServe{width:110px;border-radius:16px;font-weight:900;font-size:15px;background:#d8d0c4;color:#8a7f72;border:2px solid #a89c8c}
#bServe.on{background:#ff9a3c;color:#fff;border-color:#c2410c;box-shadow:0 3px 0 #9a3412}
#items{display:grid;grid-template-columns:repeat(8,1fr);gap:5px 4px;padding:0 3px 3px}
.it{aspect-ratio:1;width:100%;max-width:48px;justify-self:center;border-radius:50%;background:#fff;border:2px solid var(--brown2);position:relative;padding:0;display:grid;place-items:center;box-shadow:0 2px 0 #0002}
.it img{width:68%;height:68%}
.it .n{position:absolute;right:-5px;bottom:-4px;background:#fff;border:1.5px solid var(--brown2);border-radius:8px;font-size:10px;font-weight:900;padding:0 3px;line-height:14px}
.it.zero{opacity:.5}
.it.raw{background:#f4ecdf}
#nav{display:flex;background:var(--cream2);border-top:2px solid var(--brown);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;position:relative;background:none;border:0;padding:4px 0 5px;font-size:11px;font-weight:800;color:var(--brown2);display:flex;flex-direction:column;align-items:center;gap:1px}
#nav img{width:28px;height:28px}
#nav .dot{position:absolute;top:2px;right:calc(50% - 20px);width:11px;height:11px;border-radius:50%;background:#e53;border:2px solid #fff;display:none}
#nav button.has .dot{display:block}
#modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:10}
#modal.hide{display:none}
.sheet{width:100%;max-width:520px;max-height:84%;background:var(--cream);border:3px solid var(--brown);border-bottom:0;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#modal.center{align-items:center}
#modal.center .sheet{border-radius:18px;border-bottom:3px solid var(--brown);max-width:400px;width:92%}
.mh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:2px dashed #d8c4a4}
.mh b{font-size:17px}
#mClose{width:32px;height:32px;border-radius:50%;border:2px solid var(--brown);background:#fff;font-weight:900;padding:0}
#mBody{overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #e3cfae;border-radius:12px;padding:7px 8px}
.li .ic{width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;font-size:24px}
.li .ic img{width:36px;height:36px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14px}
.li .tx small{display:block;color:#8a7360;font-size:12px;font-weight:600}
.li.lock{opacity:.6}
.btn{border:2px solid #2d7a26;background:#55c24a;color:#fff;font-weight:900;border-radius:10px;padding:6px 9px;font-size:12px;white-space:nowrap;box-shadow:0 2px 0 #2d7a26}
.btn.o{background:#ff9a3c;border-color:#c2410c;box-shadow:0 2px 0 #9a3412}
.btn.g{background:#e3d8c8;border-color:#a89c8c;color:#7a6e60;box-shadow:none}
.btn.r{background:#e8604a;border-color:#a33}
.btn.big{font-size:16px;padding:10px 14px;width:100%}
.btns{display:flex;flex-direction:column;gap:4px}
.rec{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}
.rec span{display:inline-flex;align-items:center;font-size:11px;font-weight:800;color:#6a5444}
.rec img{width:16px;height:16px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:2px solid var(--brown2);background:#fff;border-radius:10px;padding:6px;font-weight:800;font-size:13px}
.tabs button.on{background:#ffd9a8}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-weight:700;background:#fff;border:2px solid #e3cfae;border-radius:12px;padding:10px 12px}
.sum .neg{color:#d23}.sum .pos{color:#2a8a2a}
input.tx{width:100%;font:inherit;font-size:16px;font-weight:700;padding:9px 10px;border:2px solid var(--brown2);border-radius:10px;background:#fff}
p.note{margin:0;font-size:13px;line-height:1.45;color:#5a4636}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%;max-width:420px}
#toast div{background:#3b2418ee;color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:12px;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="row">
      <div id="lvl"><b id="hLv">1</b></div>
      <div class="pill money" id="pMoney"><span id="icCoin"></span><b id="hMoney">0</b><button id="bAdd" title="Kho">+</button></div>
      <div class="pill star"><span>⭐</span><b id="hStar">5,0</b></div>
      <div class="pill time"><span id="hSun">☀️</span><b id="hTime">T2 · 08:00</b></div>
    </div>
    <div class="row">
      <div id="quest"><div class="qi">📋</div><div class="qb"><div id="qText"></div><div class="qline"><div class="qbar"><i id="qFill"></i></div><span id="qCount"></span></div></div><b id="qReward"></b></div>
      <button class="sq" id="bPause" title="Tạm dừng">⏸</button>
      <button class="sq" id="bSpeed" title="Tốc độ">1×</button>
      <button class="sq" id="bSet" title="Cài đặt">⚙️</button>
    </div>
    <div class="xpwrap"><div class="xpbar"><i id="xpFill"></i></div><span id="xpText"></span></div>
  </div>
  <div id="scene">
    <canvas id="cv"></canvas>
    <button id="prevShop" class="arrow">‹</button><button id="nextShop" class="arrow">›</button>
    <div id="combo"></div>
    <div id="paused">TẠM DỪNG</div>
    <button id="bFold">▼</button>
  </div>
  <div id="panel">
    <div id="tickets"></div>
    <div id="dishes"></div>
    <div class="trayrow"><div id="tray"></div><button id="bServe">PHỤC VỤ</button></div>
    <div id="items"></div>
  </div>
  <nav id="nav">
    <button data-tab="kho"><i class="dot"></i><img class="px" data-ic="📦"><span>Kho</span></button>
    <button data-tab="menu"><i class="dot"></i><img class="px" data-ic="#book"><span>Thực đơn</span></button>
    <button data-tab="upg"><i class="dot"></i><img class="px" data-ic="#arrow"><span>Nâng cấp</span></button>
    <button data-tab="staff"><i class="dot"></i><img class="px" data-ic="#chef"><span>Nhân viên</span></button>
    <button data-tab="shop"><i class="dot"></i><img class="px" data-ic="#shop"><span>Quán</span></button>
  </nav>
</div>
<div id="modal" class="hide"><div class="sheet"><div class="mh"><b id="mTitle"></b><button id="mClose">✕</button></div><div id="mBody"></div></div></div>
<div id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ================= DỮ LIỆU =================
// món ăn: [id, tên, icon, giá, cấp mở, công thức (cho 1 mẻ 4 phần)]
// nguyên liệu: [id, tên, icon, giá nhập/đơn vị, giá bán thêm (0 = không bán lẻ), cấp mở?]
const SHOPS=[
 {id:'lau',name:'Sôi Lẩu',kind:'Quán lẩu',theme:'lau',req:1,cost:0,pm:1,cm:1,
  items:[['bo','Thịt bò','🥩',30000,59000],['bachi','Ba chỉ','🥓',25000,49000],['tom','Tôm','🦐',35000,69000],['muc','Mực','🦑',35000,69000],
   ['ca','Cá','🐟',25000,49000],['ga','Thịt gà','🍗',20000,45000],['rau','Rau','🥬',8000,15000],['nam','Nấm','🍄',12000,25000],
   ['dauhu','Đậu hũ','#tofu',6000,15000],['bun','Bún','#noodle',5000,10000],['ot','Ớt','🌶️',3000,0],['trada','Trà đá','#icetea',1000,5000,1],
   ['nuoc','Nước ngọt','🥤',8000,20000,1],['flan','Bánh flan','🍮',6000,15000,4],['kem','Kem','🍨',9000,25000,7]],
  dishes:[['thai','Lẩu Thái','pot:#e8572e:🦐',199000,1,{tom:2,muc:1,nam:1,rau:2,bun:1}],
   ['nam','Lẩu Nấm','pot:#c9a46a:🍄',169000,1,{nam:3,rau:2,dauhu:2}],
   ['bo','Lẩu Bò','pot:#a8442e:🥩',229000,3,{bo:3,rau:2,bun:1}],
   ['haisan','Lẩu Hải Sản','pot:#f08a3a:🦑',269000,5,{tom:2,muc:2,ca:1,rau:1}],
   ['ga','Lẩu Gà Lá É','pot:#e8cf6a:🍗',209000,8,{ga:3,rau:2,nam:1}],
   ['kimchi','Lẩu Kim Chi','pot:#d63a2a:🌶️',219000,10,{bachi:2,ot:2,dauhu:1,rau:1}],
   ['cakeo','Lẩu Cá Kèo','pot:#9cb84a:🐟',239000,13,{ca:3,rau:2,ot:1}]]},
 {id:'vat',name:'Lúc Lắc',kind:'Quán ăn vặt bờ sông',theme:'vat',req:6,cost:150e6,pm:6,cm:4,
  items:[['xoai','Xoài','🥭',6000,0],['coc','Cóc','#coc',5000,0],['oi','Ổi','#guava',5000,0],['dau','Dâu','🍓',9000,0],
   ['bt','Bánh tráng','#ricepaper',3000,0],['muoi','Muối tôm','#salt',2000,0],['ot','Ớt','🌶️',1500,0],['trung','Trứng cút','🥚',3000,12000],
   ['khobo','Khô bò','#jerky',12000,25000],['tratac','Trà tắc','🍹',4000,15000,6],['mia','Nước mía','#cane',3000,12000,6],
   ['dua','Nước dừa','🥥',8000,25000,7],['suachua','Sữa chua','#yogurt',5000,15000,9]],
  dishes:[['xoailac','Xoài lắc','cup:#f2c230:🥭',45000,6,{xoai:2,muoi:1,ot:1}],
   ['coclac','Cóc lắc','cup:#8cc63f:',40000,6,{coc:2,muoi:1,ot:1}],
   ['oilac','Ổi lắc','cup:#c5e07a:',40000,8,{oi:2,muoi:1}],
   ['btt','Bánh tráng trộn','bowl:#e8963a:🥚',35000,10,{bt:2,trung:1,khobo:1,muoi:1}],
   ['daulac','Dâu lắc','cup:#e8485a:🍓',55000,12,{dau:2,muoi:1}],
   ['thapcam','Trái cây thập cẩm','cup:#f28fb0:🥭',60000,15,{xoai:1,dau:1,oi:1,suachua:1}]]},
 {id:'hoian',name:'Phố Hội',kind:'Quán cà phê phố cổ',theme:'hoian',req:12,cost:1.5e9,pm:25,cm:16,
  items:[['caphe','Cà phê','#bean',5000,0],['sua','Sữa đặc','🥛',4000,0],['da','Đá','🧊',500,0],['dao','Đào','🍑',6000,0],
   ['tra','Trà','🍵',2000,0],['banhmi','Bánh mì','🥖',4000,0],['thit','Thịt xá xíu','🥩',15000,30000],['rau','Rau','🥬',3000,8000],
   ['mi','Mì','#noodle',4000,0],['trung','Trứng','🥚',3000,8000],['flan','Bánh flan','🍮',5000,15000,12],
   ['nuoc','Nước suối','#water',2000,10000,12],['croissant','Bánh sừng bò','🥐',8000,25000,15]],
  dishes:[['cfsua','Cà phê sữa','glass:#4a2a18,#c99560:',29000,12,{caphe:1,sua:1,da:1}],
   ['bacxiu','Bạc xỉu','glass:#a8754a,#efe0c2:',32000,12,{caphe:1,sua:2,da:1}],
   ['tradao','Trà đào','glass:#f2a65a:🍑',35000,14,{tra:1,dao:2,da:1}],
   ['banhmi','Bánh mì Phượng','plate::🥖',30000,16,{banhmi:1,thit:1,rau:1,trung:1}],
   ['caolau','Cao lầu','bowl:#d9a85a:🥩',45000,18,{mi:2,thit:1,rau:1}],
   ['miquang','Mì Quảng','bowl:#f2c230:🥚',45000,21,{mi:2,trung:1,thit:1,rau:1}]]}
];
SHOPS.forEach(s=>{
  s.dishes=s.dishes.map(([id,name,icon,price,lv,rec])=>({id,name,icon,price,lv,rec}));
  s.items=s.items.map(([id,name,icon,cost,sale,lv])=>{
    if(lv==null){const us=s.dishes.filter(d=>d.rec[id]).map(d=>d.lv);lv=us.length?Math.min(...us):s.req}
    return {id,name,icon,cost,sale,lv:Math.max(lv,s.req)};
  });
  s.I={};s.items.forEach(i=>s.I[i.id]=i);s.D={};s.dishes.forEach(d=>s.D[d.id]=d);
});

function pixelize(c,fallback){
  const g=c.getContext('2d'),d=g.getImageData(0,0,16,16),p=d.data;let any=0;
  for(let i=3;i<p.length;i+=4){p[i]=p[i]>110?255:0;if(p[i])any=1}
  if(!any&&fallback){g.clearRect(0,0,16,16);g.fillStyle='#e8a05a';g.beginPath();g.arc(8,8,6,0,7);g.fill();g.fillStyle='#fff';g.font='bold 9px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(fallback,8,9);return pixelize(c)}
  const o=new Uint8Array(256),a=i=>p[i*4+3];
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){const i=y*16+x;if(a(i))continue;
    if((x>0&&a(i-1))||(x<15&&a(i+1))||(y>0&&a(i-16))||(y<15&&a(i+16)))o[i]=1}
  for(let i=0;i<256;i++)if(o[i]){p[i*4]=52;p[i*4+1]=32;p[i*4+2]=22;p[i*4+3]=255}
  g.putImageData(d,0,0);return c}

  try{const t=JSON.parse(localStorage.getItem(SAVE));

      SHOPS.forEach(d=>{const sh=S.shops[d.id]=Object.assign(newShop(d),t.shops&&t.shops[d.id]||{});
        d.items.forEach(i=>{if(sh.stock[i.id]==null)sh.stock[i.id]=0});
        d.dishes.forEach(x=>{if(sh.dish[x.id]==null)sh.dish[x.id]=0;if(sh.dishLv[x.id]==null)sh.dishLv[x.id]=0})});

  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}

const cookTime=()=>7*Math.pow(.88,sh().fast);
const canCook=d=>Object.keys(d.rec).every(k=>sh().stock[k]>=d.rec[k]);

function cook(id,auto){const d=def().D[id],i=freeStove();
  if(i<0){if(!auto)toast('Bếp đang bận hết — nâng cấp thêm bếp nhé');return false}
  if(!canCook(d)){if(auto)return false;
    const miss=Object.keys(d.rec).filter(k=>sh().stock[k]<d.rec[k]);
    const cost=miss.reduce((a,k)=>a+packCost(def().I[k])*Math.ceil((d.rec[k]-sh().stock[k])/10),0);
    if(S.money<cost){toast('Thiếu '+miss.map(k=>def().I[k].name).join(', ')+' — không đủ tiền nhập');SFX.bad();return false}
    miss.forEach(k=>buy(k,Math.ceil((d.rec[k]-sh().stock[k])/10),true));toast('Đã nhập thêm '+miss.map(k=>def().I[k].name).join(', ')+' ('+fmt(cost)+')')}
  for(const k in d.rec)sh().stock[k]-=d.rec[k];
  R.stoves[i]={id,t:0,dur:cookTime()*(auto?1/(1+.2*sh().chefLv):1),auto};R.lastCook=i;if(!auto)SFX.cook();dirtyItems=true;return true}
function buy(id,packs,silent){const it=def().I[id],c=packCost(it)*packs;if(S.money<c){if(!silent){toast('Không đủ tiền');SFX.bad()}return false}

  if(!R.shipper)R.shipper={x:-OX-20,dir:1,look:{s:pick(SKIN),h:'#2b1d16',c:'#3aa84a',p:'#2b2b2b',st:0,hat:'helmet',hc:'#3aa84a'}};dirtyItems=true;return true}

function sim(dt){

  for(const g of R.groups){
    let all=true;
    if(g.state==='walk'||g.state==='leave'||g.state==='queue'){
      for(const m of g.members){if(m.delay>0){m.delay-=dt;all=false;continue}
        if(!stepPath(m,34,dt))all=false;else if(g.state==='walk')m.sat=true}}
    if(g.state==='walk'&&all){g.state='think';g.t=1.2}
    else if(g.state==='queue'){g.qw+=dt;const t=freeTable();if(t>=0)assign(g,t);else if(g.qw>25||S.time>=1290)leave(g)}
    else if(g.state==='think'){g.t-=dt;if(g.t<=0){g.order=makeOrder(g.n);g.state='wait';g.ot=performance.now()+Math.random();g.waited=0;SFX.bell();if(!R.sel&&!R.tray.length)autoSelect()}}
    else if(g.state==='wait'){g.waited+=dt;if(g.waited>g.patience)angry(g)}
    else if(g.state==='eat'){g.t-=dt;if(g.t<=0)payGroup(g)}
    else if(g.state==='leave'&&all)g.dead=true}
  R.groups=R.groups.filter(g=>!g.dead);
  // bếp
  R.stoves.forEach((s,i)=>{if(!s)return;s.t+=dt;if(s.t>=s.dur){sh().dish[s.id]+=4;R.stoves[i]=null;fx(sx(i),G.kTop-14,'+4','#fff');if(!s.auto)SFX.done();dirtyItems=true}});
  R.chefT-=dt;if(R.chefT<=0&&sh().chefs){R.chefT=.5;const busy=R.stoves.filter(s=>s&&s.auto).length;
    if(busy<sh().chefs){const target=6+2*sh().chefLv,cooking=R.stoves.filter(Boolean).map(s=>s.id);
      const ds=activeDishes().filter(d=>sh().dish[d.id]<target&&canCook(d)&&!cooking.includes(d.id)).sort((a,b)=>sh().dish[a.id]-sh().dish[b.id]);if(ds[0])cook(ds[0].id,true)}}
  // phục vụ
  for(const w of R.waiters){const sp=40*(1+.15*sh().waiterLv);
    if(w.state==='idle'){const g=R.groups.filter(g=>g.state==='wait'&&!g.waiter&&g!==R.sel).sort((a,b)=>a.ot-b.ot).find(g=>{const c=counts(g.order);return Object.keys(c).every(k=>stockOf(k)>=c[k])});
      if(g){g.order.forEach(k=>addStock(k,-1));w.carry=g.order.slice();w.g=g;g.waiter=w;const p=tpos(g.table),a=aisleOf(p.c);w.path=[{x:a,y:G.kBot+8},{x:a,y:p.y+4}];w.state='go';dirtyItems=true}}
    else if(w.state==='go'){if(stepPath(w,sp,dt)){const g=w.g;if(g&&g.state==='wait'){serveGroup(g,false);g.waiter=null}else w.carry.forEach(k=>addStock(k,1));
      w.carry=[];w.g=null;w.path=[{x:w.x,y:G.kBot+8},{x:w.hx,y:G.kBot+8}];w.state='back'}}
    else if(w.state==='back'){if(stepPath(w,sp,dt))w.state='idle'}}

3️⃣ Bấm <b>PHỤC VỤ</b>. Phục vụ nhanh để lên <b>Combo</b> và được nhiều sao, nhiều tiền boa.<br>
4️⃣ Hết món thì bấm 🔥 để nấu 1 mẻ (4 phần). Hết nguyên liệu thì nhập ở <b>Kho</b> hoặc bấm thẳng vào nguyên liệu.<br>
5️⃣ Dùng tiền để thêm bàn, thêm bếp, thuê đầu bếp và phục vụ tự làm, học món mới, rồi mở thêm quán ở <b>Quán</b>.<br>
🕗 Quán mở 8:00–22:00, giờ cao điểm 11–13h và 18–20h. Cuối ngày trả lương và tiền mặt bằng.</p>`;
$('#mBody').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const [a,v,w]=b.dataset.a.split(':');const s=sh(),d=def();SFX.tap();
  if(a==='close')return closeModal();
  if(a==='newday')return newDay();
  if(a==='start'){const n=$('#inStart').value.trim().slice(0,12);S.owner=n;S.intro=true;buildLayers();closeModal();save();toast('Chào mừng chủ quán '+(n||'mới')+'! 🍲');return}
  if(a==='buy'){buy(v,+w)}
  else if(a==='learn'){const x=d.D[v],c=learnCost(x);if(S.money<c)return toast('Không đủ tiền');S.money-=c;s.learned.push(v);s.dish[v]+=4;Object.keys(x.rec).forEach(k=>s.stock[k]+=10);toast('Đã học món '+x.name+'!');SFX.lvl();buildPanel()}
  else if(a==='dup'){const x=d.D[v],c=dishUpCost(x);if(S.money<c)return toast('Không đủ tiền');S.money-=c;s.dishLv[v]++;SFX.buy()}
  else if(a==='tog'){if(!s.off.includes(v))s.off.push(v);else s.off=s.off.filter(x=>x!==v);if(!activeDishes().length){s.off=s.off.filter(x=>x!==v);toast('Phải bán ít nhất 1 món')}buildPanel()}
  else if(a==='upg'){const u=UPG.find(u=>u.k===v),c=upCost(u);if(S.money<c)return toast('Không đủ tiền');S.money-=c;s[v]++;SFX.buy();if(v==='decor')buildLayers()}
  else if(a==='hire'){const st=STAFF.find(x=>x.k===v),c=nice(st.hire(s[v])*d.cm);if(S.money<c)return toast('Không đủ tiền');S.money-=c;s[v]++;SFX.buy();syncWaiters()}
  else if(a==='fire'){s[v]--;if(v==='waiters'){const wk=R.waiters.pop();if(wk&&wk.g){wk.carry.forEach(k=>addStock(k,1));wk.g.waiter=null}}}
  else if(a==='train'){const c=nice(4e6*Math.pow(2,s[v])*d.cm);if(S.money<c)return toast('Không đủ tiền');S.money-=c;s[v]++;SFX.buy()}
  else if(a==='go'){closeModal();return switchShop(v)}
  else if(a==='open'){const x=SHOPS.find(x=>x.id===v);if(S.money<x.cost)return toast('Không đủ tiền');S.money-=x.cost;S.shops[v].unlocked=true;SFX.lvl();closeModal();return switchShop(v)}
  else if(a==='rename'){const n=$('#inName').value.trim().slice(0,18);if(n){s.name=n;buildLayers();toast('Đã đổi tên quán')}}
  else if(a==='sound'){S.sound=!S.sound;save();return settings()}
  else if(a==='owner'){S.owner=$('#inOwner').value.trim().slice(0,12);buildLayers();save();toast('Đã lưu tên');return}
  else if(a==='help')return openModal('📘 Cách chơi',HELP+'<button class="btn big" data-a="close">Đã hiểu</button>');
  else if(a==='reset')return openModal('Xoá tiến trình?','<p class="note">Toàn bộ tiền, cấp, quán sẽ mất và không khôi phục được.</p><button class="btn big r" data-a="reset2">Xoá và chơi lại</button>',{center:1});
  else if(a==='reset2'){try{localStorage.removeItem(SAVE)}catch(e){}location.reload();return}
  dirtyItems=true;save();if(modalTab)tab(modalTab);updateHUD()};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{SFX.tap();tab(b.dataset.tab)});
document.querySelectorAll('img[data-ic]').forEach(im=>im.src=url(im.dataset.ic));
$('#icCoin').innerHTML=`<img class="px" src="${url('#coin')}" style="width:20px;height:20px;display:block">`;
$('#bAdd').onclick=()=>{SFX.tap();tab('kho')};
$('#bSet').onclick=()=>{SFX.tap();settings()};
let paused=false;
$('#bPause').onclick=()=>{paused=!paused;SFX.tap();updateHUD()};
$('#bSpeed').onclick=()=>{S.speed=S.speed>=3?1:S.speed+1;SFX.tap();updateHUD();save()};
$('#bFold').onclick=()=>{const p=$('#panel');p.classList.toggle('fold');$('#bFold').textContent=p.classList.contains('fold')?'▲':'▼'};
$('#quest').onclick=()=>{const q=S.quest;toast('📋 '+q.txt+' — thưởng '+fmt(q.rw)+' và '+q.xp+' XP')};
function cycleShop(dir){const un=SHOPS.filter(d=>S.shops[d.id].unlocked);const i=un.findIndex(d=>d.id===S.active);switchShop(un[(i+dir+un.length)%un.length].id)}
$('#prevShop').onclick=()=>cycleShop(-1);$('#nextShop').onclick=()=>cycleShop(1);
function switchShop(id){if(id===S.active)return;
  R.stoves.forEach(s=>{if(s)sh().dish[s.id]+=4});R.tray.forEach(k=>addStock(k,1));R.waiters.forEach(w=>w.carry.forEach(k=>addStock(k,1)));
  S.active=id;resetRuntime();buildLayers();buildPanel();tkEls.forEach(el=>el.remove());tkEls.clear();
  if(S.quest.t==='sell'&&S.quest.shop!==id&&S.quest.p===0)newQuest();save();toast('🏪 Đến quán '+sh().name);updateHUD()}

// ================= KHUNG HÌNH =================
function resize(){const r=$('#scene').getBoundingClientRect();if(!r.width||!r.height)return;const oldH=H;
  H=Math.max(300,Math.round(W*r.height/r.width));const s=Math.min(r.width/W,r.height/H),dpr=window.devicePixelRatio||1;
  VW=Math.max(W,Math.ceil(r.width/s));OX=Math.floor((VW-W)/2);
  K=clamp(Math.ceil(s*dpr),1,5);cv.width=VW*K;cv.height=H*K;cv.style.width=VW*s+'px';cv.style.height=H*s+'px';cv.style.left=(r.width-VW*s)/2+'px';cv.style.top=(r.height-H*s)/2+'px';
  geom();const dH=H-oldH;
  if(R&&dH){const mv=o=>{o.y+=dH;(o.path||[]).forEach(p=>p.y+=dH)};R.groups.forEach(g=>g.members.forEach(mv));R.waiters.forEach(mv);R.walkers.forEach(w=>w.y+=dH);R.fx.forEach(f=>f.y+=dH)}
  buildLayers()}
let last=performance.now(),uiT=0,hudT=0,saveT=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!paused&&!modalOpen){const sd=dt*S.speed;sim(sd);animStreet(sd);anim+=sd}
  draw();
  uiT-=dt;if(uiT<=0){uiT=.1;renderTickets();updatePanel()}
  hudT-=dt;if(hudT<=0){hudT=.25;updateHUD()}
  saveT-=dt;if(saveT<=0){saveT=5;save()}
  requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
window.addEventListener('pagehide',save);

load();geom();resetRuntime();if(!S.quest)newQuest();
new ResizeObserver(resize).observe($('#scene'));resize();buildPanel();updateHUD();
if(!S.intro)openModal('🍲 Quán Ngon Pixel',`<p class="note">Bạn vừa nhận lại quán lẩu nhỏ đầu phố. Phục vụ thật nhanh, kiếm combo, mở rộng thành chuỗi quán ngon nhất thành phố!</p>${HELP}
  <div class="tx"><b>Tên chủ quán (hiện trên biển hiệu)</b><input class="tx" id="inStart" maxlength="12" placeholder="VD: emNh"></div>
  <button class="btn big o" data-a="start">Mở quán!</button>`,{center:1,noclose:1});
requestAnimationFrame(frame);
</script>
</body>
</html>
