<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2d6b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Nông Trại Pixel</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2d6b2a;color:#3b2412;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer}
canvas#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
.panel{background:#f6e7c1;border:3px solid #7a4a26;border-radius:6px;box-shadow:0 3px 0 #4e2c12;padding:4px 8px;font-weight:800;font-size:13px}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px;padding-top:max(8px,env(safe-area-inset-top));pointer-events:none;gap:8px}
#hud .panel{pointer-events:auto;min-width:118px}
.bar{height:7px;background:#5a3a22;border-radius:3px;margin-top:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:#7fc24a;transition:width .2s}
.bar.e i{background:#f6c23c}.bar.w i{background:#4fa3e0}.bar.x i{background:#c77de0}
.lbl{display:flex;justify-content:space-between;gap:6px;font-size:11px;margin-top:2px}
#hr{text-align:right}
#hMoney{font-size:15px}
#side{position:absolute;right:8px;top:calc(max(8px,env(safe-area-inset-top)) + 84px);display:flex;flex-direction:column;gap:6px}
.rb{width:42px;height:42px;font-size:20px;padding:0;background:#f6e7c1;border:3px solid #7a4a26;border-radius:8px;box-shadow:0 3px 0 #4e2c12;position:relative}
.rb:active{transform:translateY(2px);box-shadow:0 1px 0 #4e2c12}
.rb .dot{position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:#e0583c;border:2px solid #fff;display:none}
.rb.has .dot{display:block}
#hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:3px;background:#7a4a26;border:3px solid #4e2c12;border-radius:8px;padding:3px;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
#hotbar::-webkit-scrollbar{display:none}
.slot{position:relative;flex:0 0 auto;width:42px;height:42px;padding:0;background:#f6e7c1;border:2px solid #c99a5b;border-radius:5px;display:flex;align-items:center;justify-content:center}
.slot img{width:32px;height:32px}
.slot.sel{border-color:#ff5a3c;background:#fff6d8;box-shadow:inset 0 0 0 2px #ffb03c}
.slot .n{position:absolute;right:1px;bottom:0;font-size:11px;font-weight:900;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.slot .k{position:absolute;left:2px;top:0;font-size:9px;font-weight:900;color:#a0703c}
#bAct{position:absolute;right:14px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 62px);width:62px;height:62px;border-radius:50%;font-size:22px;font-weight:900;color:#fff;background:#e0583c;border:4px solid #7a2a18;box-shadow:0 4px 0 #4e1a0e;display:none}
#bAct:active{transform:translateY(3px);box-shadow:0 1px 0 #4e1a0e}
body.touch #bAct{display:block}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 70px);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:min(92%,420px)}
.toast{background:rgba(40,24,10,.9);color:#fff;border:2px solid #f6c23c;border-radius:6px;padding:5px 10px;font-weight:800;font-size:13px;text-align:center;animation:tt 2.8s forwards}
@keyframes tt{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#modal{position:absolute;inset:0;background:rgba(20,12,4,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:5}
#modal.hide{display:none}
.box{background:#f6e7c1;border:4px solid #7a4a26;border-radius:10px;box-shadow:0 5px 0 #4e2c12;width:min(100%,440px);max-height:min(88vh,660px);display:flex;flex-direction:column;overflow:hidden}
.box h2{margin:0;padding:8px 12px;background:#7a4a26;color:#ffe7a8;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h2 button{background:none;border:none;color:#ffe7a8;font-size:20px;padding:0 4px}
.bd{padding:10px 12px;overflow-y:auto;font-size:14px;line-height:1.45}
.tabs{display:flex;gap:4px;padding:8px 12px 0}
.tab{flex:1;padding:6px 2px;border:2px solid #7a4a26;border-bottom:none;border-radius:6px 6px 0 0;background:#e3cc98;font-weight:800;font-size:13px}
.tab.on{background:#fff6d8}
.row{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:2px dashed #e0c88f}
.row img{width:32px;height:32px;flex:0 0 auto}
.row .t{flex:1;min-width:0}
.row .t b{display:block}
.row .t small{color:#7a5a3a;font-size:12px}
.row.off{opacity:.55}
.btn{background:#7fc24a;color:#1f3a10;border:2px solid #3f6b22;border-radius:6px;padding:5px 9px;font-weight:900;box-shadow:0 2px 0 #3f6b22;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.o{background:#f6c23c;border-color:#9a6a10;color:#4a2a0a;box-shadow:0 2px 0 #9a6a10}
.btn.r{background:#e0583c;border-color:#7a2a18;color:#fff;box-shadow:0 2px 0 #7a2a18}
.btn:disabled{background:#cdbb92;border-color:#a08a60;color:#7a6a4a;box-shadow:none}
.big{width:100%;padding:9px;font-size:16px;margin-top:8px}
.muted{color:#8a6a4a;font-size:12px}
.sec{color:#8a6a4a;font-size:12px;font-weight:800;padding:10px 0 2px}
input.nm{width:100%;font:inherit;font-weight:800;font-size:16px;padding:7px;border:3px solid #7a4a26;border-radius:6px;background:#fff6d8;color:#3b2412}
ul.help{padding-left:18px;margin:6px 0}
.hearts{color:#e0405a;letter-spacing:1px;font-size:13px}
.npchead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.npchead img{width:48px;height:60px;background:#e3cc98;border:2px solid #7a4a26;border-radius:6px;flex:0 0 auto}
.say{background:#fff6d8;border:2px solid #c99a5b;border-radius:8px;padding:6px 8px;margin:4px 0 8px}
.quest{background:#ffe9a8;border:2px dashed #c08a20;border-radius:8px;padding:6px 8px;margin:6px 0}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.gift{width:64px;padding:3px;border:2px solid #c99a5b;border-radius:6px;background:#fff6d8;text-align:center;font-size:10px;font-weight:800;line-height:1.2}
.gift img{width:28px;height:28px;display:block;margin:0 auto 2px}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:6}
</style>
</head>

<script>
'use strict';
const T=16, MW=40, MH=30, SAVE_KEY='nongtrai.v1';
const $=s=>document.querySelector(s);
const cv=$('#cv'), cx=cv.getContext('2d');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const rng=seed=>{let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}};
const hash=(x,y)=>((x*73856093)^(y*19349663))>>>0;
const R=(g,c,x,y,w=1,h=1)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
const circ=(g,c,cx0,cy0,rx,ry=rx)=>{g.fillStyle=c;for(let y=Math.floor(cy0-ry);y<=cy0+ry;y++)for(let x=Math.floor(cx0-rx);x<=cx0+rx;x++){const dx=(x+.5-cx0)/rx,dy=(y+.5-cy0)/ry;if(dx*dx+dy*dy<=1)g.fillRect(x,y,1,1)}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('vi-VN');
const pick=a=>a[Math.random()*a.length|0];

/* ================= DỮ LIỆU ================= */
const SEASON_LEN=14;
const SEASONS=[{n:'Xuân',i:'🌸'},{n:'Hạ',i:'☀️'},{n:'Thu',i:'🍂'},{n:'Đông',i:'❄️'}];
const seasonOf=d=>Math.floor((d-1)/SEASON_LEN)%4, sDay=d=>(d-1)%SEASON_LEN+1, yearOf=d=>Math.floor((d-1)/(SEASON_LEN*4))+1;
const CROPS={
  cucai:{n:'Củ cải',grow:3,seed:20,sell:45,xp:5,lv:1,ss:[0,3],col:'#c9a0e0'},
  carot:{n:'Cà rốt',grow:4,seed:35,sell:80,xp:7,lv:1,ss:[0,2],col:'#f08a24'},
  khoaitay:{n:'Khoai tây',grow:5,seed:45,sell:110,xp:9,lv:1,ss:[0],col:'#c8a060'},
  dautay:{n:'Dâu tây',grow:7,regrow:3,seed:90,sell:85,xp:10,lv:2,ss:[0],col:'#e02a4a',fruit:1},
  cachua:{n:'Cà chua',grow:6,regrow:3,seed:60,sell:55,xp:8,lv:1,ss:[1],col:'#e0402a',fruit:1},
  bap:{n:'Bắp',grow:8,regrow:4,seed:110,sell:90,xp:12,lv:2,ss:[1,2],col:'#f6d33c'},
  duahau:{n:'Dưa hấu',grow:9,seed:130,sell:340,xp:22,lv:3,ss:[1],col:'#e8505a',fruit:1},
  bingo:{n:'Bí ngô',grow:10,seed:150,sell:420,xp:25,lv:3,ss:[2],col:'#ec8a1e'},
  caithao:{n:'Cải thảo',grow:5,seed:40,sell:100,xp:8,lv:1,ss:[3],col:'#a8d878'},
};
const FISH={
  caro:{n:'Cá rô',sell:40,where:['ao'],ss:[0,1,2,3],diff:.2,col:'#8a9a5a'},
  cachep:{n:'Cá chép',sell:75,where:['ao','song'],ss:[0,1,2],diff:.35,col:'#c8a040'},
  catre:{n:'Cá trê',sell:95,where:['ao'],ss:[0,1,2,3],night:1,diff:.45,col:'#5a5a6a'},
  caloc:{n:'Cá lóc',sell:120,where:['ao'],ss:[1,2],diff:.55,col:'#4a6a4a'},
  cabong:{n:'Cá bống',sell:60,where:['song'],ss:[0,1,2,3],diff:.3,col:'#b0a080'},
  cahoi:{n:'Cá hồi suối',sell:170,where:['song'],ss:[2,3],diff:.6,col:'#e08a7a'},
  cachepvang:{n:'Cá chép vàng',sell:600,where:['song'],ss:[0,1,2,3],diff:.85,rare:1,col:'#f6c23c'},
  dep:{n:'Chiếc dép cũ',sell:1,junk:1,col:'#7a5a3a'},
};
const ANIP={trung:{n:'Trứng gà',sell:50},trungto:{n:'Trứng gà to',sell:95},sua:{n:'Sữa bò',sell:125},suangon:{n:'Sữa bò thượng hạng',sell:190}};
const ART={phomai:{n:'Phô mai',sell:230},phomaingon:{n:'Phô mai thượng hạng',sell:345},banhflan:{n:'Bánh flan',sell:180}};
const SHOPIT={
  coffee:{n:'Cà phê sữa',d:'Uống hồi 40 ⚡',p:80,lv:1,kind:'item'},
  bunhin:{n:'Bù nhìn',d:'Đuổi quạ trong bán kính 6 ô',p:150,lv:1,kind:'item'},
  hay:{n:'Cỏ khô ×10',d:'Thức ăn cho gà, bò (mỗi con 1/ngày)',p:150,lv:1,kind:'hay'},
  canBig:{n:'Bình tưới lớn',d:'Chứa 40 lượt nước',p:600,lv:2,kind:'up'},
  hoeSilver:{n:'Cuốc bạc',d:'Cuốc 3 ô thẳng hàng',p:1500,lv:3,kind:'up'},
  canSilver:{n:'Bình tưới bạc',d:'Tưới 3 ô thẳng hàng',p:2000,lv:4,kind:'up'},
};
const DECO={
  bunhin:{n:'Bù nhìn',b:1},
  chauhoa:{n:'Chậu hoa',d:'+2 điểm đẹp',p:100,b:2,lv:1},
  ghe:{n:'Ghế gỗ',d:'+3 điểm đẹp',p:200,b:3,lv:1},
  den:{n:'Đèn lồng',d:'+4 điểm đẹp, sáng ban đêm',p:250,b:4,lv:2},
  tuong:{n:'Tượng gà vàng',d:'+15 điểm đẹp',p:3000,b:15,lv:4},
  haorao:{n:'Hàng rào gỗ',d:'Gói 10 cái',p:80,pack:10,lv:1},
  dalat:{n:'Đá lát đường',d:'Gói 5 viên, lát lên ô cỏ',p:60,pack:5,lv:1},
};
const MACH={
  nmut:{n:'Nồi nấu mứt',d:'Trái cây → mứt (10 giờ)',p:500,lv:2,time:600,acc:k=>!!(CROPS[k]&&CROPS[k].fruit),out:k=>['mut_'+k,1]},
  mayep:{n:'Máy ép nước',d:'Rau củ → nước ép (8 giờ)',p:800,lv:2,time:480,acc:k=>!!(CROPS[k]&&!CROPS[k].fruit),out:k=>['ep_'+k,1]},
  lobanh:{n:'Lò bánh flan',d:'Trứng → bánh flan (5 giờ)',p:900,lv:3,time:300,acc:k=>k==='trung'||k==='trungto',out:k=>['banhflan',k==='trungto'?2:1]},
  mayphomai:{n:'Máy làm phô mai',d:'Sữa → phô mai (4 giờ)',p:1200,lv:4,time:240,acc:k=>k==='sua'||k==='suangon',out:k=>[k==='sua'?'phomai':'phomaingon',1]},
};
const BUILD={
  coop:{n:'Chuồng gà',d:'Nuôi tối đa 6 con gà · tặng 10 cỏ khô',p:800,lv:1},
  south:{n:'Dọn bụi gai phía Nam',d:'Mở khu đất rộng dưới ruộng',p:2000,lv:2},
  barn:{n:'Chuồng bò',d:'Nuôi tối đa 4 con bò',p:2500,lv:3},
  east:{n:'Dọn bụi gai phía Đông',d:'Mở lối ra suối – có cá quý',p:5000,lv:4},
};
const ANIMAL={ga:{n:'Gà',p:400,cap:6,need:'coop'},bo:{n:'Bò',p:1500,cap:4,need:'barn'}};
const NAMES=['Mít','Bông','Cốm','Xôi','Bơ','Đậu','Mận','Bắp','Kem','Tôm','Mơ','Lu','Bin','Gấu','Nếp','Su'];
const PLACE_ORDER=['bunhin','chauhoa','ghe','den','tuong','haorao','dalat','nmut','mayep','lobanh','mayphomai'];
const xpNeed=lv=>50*lv;
const OPEN=8*60, CLOSE=18*60, DAY_START=6*60, PASS_OUT=26*60;
// ground: 0 cỏ, 1 đường, 2 nước, 3 đất cuốc
// obj: 0 trống,1 cây,2 rào,3 đá,4 cỏ dại,5 nhà,6 giếng,7 tiệm,8 đồ đặt (S.pl),9 bụi,10 xưởng mộc,11 chuồng gà,12 chuồng bò,13 bụi gai
const HOUSE={x:3,y:2,w:5,h:4}, SHOP={x:23,y:4,w:3,h:2}, WORK={x:28,y:4,w:3,h:2}, WELL={x:10,y:4};
const COOP={x:13,y:3,w:2,h:2}, BARN={x:18,y:3,w:3,h:2}, PEN={x0:13,y0:3,x1:20,y1:6};
const FIELD={x:3,y:10,w:18,h:11}, DOOR={x:5,y:6};
const SOUTH={x0:2,x1:31,y0:23,y1:27}, EAST={x0:33,x1:35,y0:2,y1:27};

function newMap(){
  const ground=new Array(MW*MH).fill(0), obj=new Array(MW*MH).fill(0);
  const r=rng(20261020), I=(x,y)=>y*MW+x;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(x<2||y<2||x>=MW-2||y>=MH-2)obj[I(x,y)]=1;
    const dx=(x-26)/3.6,dy=(y-16)/2.6; if(dx*dx+dy*dy<=1)ground[I(x,y)]=2;
    if((x===36||x===37)&&y>=2&&y<=27)ground[I(x,y)]=2;
  }
  const rect=(o,v)=>{for(let y=o.y;y<o.y+o.h;y++)for(let x=o.x;x<o.x+o.w;x++)obj[I(x,y)]=v};
  rect(HOUSE,5);rect(SHOP,7);rect(WORK,10);obj[I(WELL.x,WELL.y)]=6;
  for(let x=12;x<=21;x++){obj[I(x,2)]=2;obj[I(x,7)]=2}
  for(let y=2;y<=7;y++){obj[I(12,y)]=2;obj[I(21,y)]=2}
  obj[I(16,7)]=0;obj[I(17,7)]=0;
  for(let y=6;y<=9;y++){ground[I(5,y)]=1;ground[I(6,y)]=1}
  for(let x=5;x<=30;x++)ground[I(x,8)]=1;
  for(let y=6;y<=7;y++){for(let x=23;x<=25;x++)ground[I(x,y)]=1;for(let x=28;x<=30;x++)ground[I(x,y)]=1}
  for(let x=FIELD.x;x<FIELD.x+FIELD.w;x++){obj[I(x,FIELD.y)]=2;obj[I(x,FIELD.y+FIELD.h-1)]=2}
  for(let y=FIELD.y;y<FIELD.y+FIELD.h;y++){obj[I(FIELD.x,y)]=2;obj[I(FIELD.x+FIELD.w-1,y)]=2}
  obj[I(5,FIELD.y)]=0;obj[I(6,FIELD.y)]=0;obj[I(20,14)]=0;obj[I(20,15)]=0;
  for(let y=FIELD.y+1;y<FIELD.y+FIELD.h-1;y++)for(let x=FIELD.x+1;x<FIELD.x+FIELD.w-1;x++){
    if(x<=8&&y<=13)continue;const v=r();if(v<.07)obj[I(x,y)]=3;else if(v<.19)obj[I(x,y)]=4}
  for(let x=2;x<=31;x++)obj[I(x,22)]=13;
  for(let y=2;y<=27;y++)obj[I(32,y)]=13;
  for(let y=SOUTH.y0;y<=SOUTH.y1;y++)for(let x=SOUTH.x0;x<=SOUTH.x1;x++){const v=r();if(v<.06)obj[I(x,y)]=3;else if(v<.16)obj[I(x,y)]=4;else if(v<.18)obj[I(x,y)]=9}
  for(let y=EAST.y0;y<=EAST.y1;y++)for(let x=EAST.x0;x<=EAST.x1;x++){const v=r();if(v<.05)obj[I(x,y)]=3;else if(v<.12)obj[I(x,y)]=4;else if(v<.16)obj[I(x,y)]=9;else if(v<.19&&x===33)obj[I(x,y)]=1}
  [[27,10],[23,20],[30,11],[30,19],[2,8],[9,6],[26,2]].forEach(([x,y])=>obj[I(x,y)]=1);
  [[29,13],[24,12],[9,2],[31,3],[2,15],[31,21]].forEach(([x,y])=>{if(!obj[I(x,y)])obj[I(x,y)]=9});
  return {ground,obj};
}
function unlockArea(S,k){
  if(k==='south')for(let x=2;x<=31;x++){const i=22*MW+x;if(S.obj[i]===13)S.obj[i]=0}
  if(k==='east')for(let y=2;y<=27;y++){const i=y*MW+32;if(S.obj[i]===13)S.obj[i]=0}
  if(k==='coop')for(let y=COOP.y;y<COOP.y+COOP.h;y++)for(let x=COOP.x;x<COOP.x+COOP.w;x++)S.obj[y*MW+x]=11;
  if(k==='barn')for(let y=BARN.y;y<BARN.y+BARN.h;y++)for(let x=BARN.x;x<BARN.x+BARN.w;x++)S.obj[y*MW+x]=12;
}
function newState(){
  const m=newMap();

function migrate(o){
  if(o.v===1){
    const n=newState();
    ['name','day','money','lv','xp','seeds','inv','up','sound','music','seen'].forEach(k=>{if(o[k]!=null)n[k]=o[k]});
    n.items.coffee=(o.items&&o.items.coffee)||0;n.items.bunhin=(o.items&&o.items.bunhin)||0;
    n.stats.earned=(o.stats&&o.stats.earned)||0;n.stats.harvest=(o.stats&&o.stats.harvest)||0;
    n.maxE=100+(n.lv-1)*10;n.energy=n.maxE;
    for(const k in (o.soil||{})){const[x,y]=k.split(',').map(Number);const i=y*MW+x;if(x<32&&y<22&&n.obj[i]===0&&n.ground[i]!==2){n.ground[i]=3;n.soil[k]=o.soil[k]}}
    for(let i=0;i<o.obj.length;i++)if(o.obj[i]===8){const x=i%32,y=i/32|0,j=y*MW+x;if(n.obj[j]===0){n.obj[j]=8;n.pl[x+','+y]={k:'bunhin'}}}
    for(const k in n.inv)if(n.inv[k])n.seenItems[k]=1;
    return n;
  }
  const d=newState();for(const k in d)if(o[k]===undefined)o[k]=d[k];
  for(const k in d.npc)if(!o.npc[k])o.npc[k]=d.npc[k];
  return o;
}

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='square',v=.05,when=0,slide=0){if(!S||!S.sound)return;const a=ac();if(!a)return;const t=a.currentTime+when,o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(gn).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,fq,type='lowpass'){if(!S||!S.sound)return;const a=ac();if(!a)return;if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const s=a.createBufferSource(),fl=a.createBiquadFilter(),gn=a.createGain(),t=a.currentTime;s.buffer=noiseBuf;fl.type=type;fl.frequency.value=fq;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0005,t+d);s.connect(fl).connect(gn).connect(a.destination);s.start(t);s.stop(t+d+.02)}

function startFish(tx,ty){
  let wx=tx,wy=ty;
  if(!inMap(wx,wy)||S.ground[idx(wx,wy)]!==2){const[dx,dy]=DIRV[P.dir];wx+=dx;wy+=dy;
    if(!inMap(wx,wy)||S.ground[idx(wx,wy)]!==2){toast('🎣 Đứng cạnh ao hoặc suối rồi quăng câu nhé');SFX.err();return}}
  if(!useEnergy(3))return;
  faceTo(wx,wy);P.path=null;
  F={st:'wait',t:(S.up.rodPro?.8:1.3)+Math.random()*(S.up.rodPro?2:3.2),wx,wy,where:wx>=33?'song':'ao',bob:0};
  SFX.cast();
}
function pickFish(where){
  const ss=seasonOf(S.day),night=S.min>=19*60;
  if(Math.random()<.08)return'dep';
  const c=Object.keys(FISH).filter(k=>{const f=FISH[k];return!f.junk&&f.where.includes(where)&&f.ss.includes(ss)&&(!f.night||night)});
  const w=c.map(k=>FISH[k].rare?(S.up.rodPro?2:1):10*(1-FISH[k].diff*.6));let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<c.length;i++){r-=w[i];if(r<=0)return c[i]}return c[0]||'caro';
}
function fishAction(){
  if(!F)return;
  if(F.st==='wait'){toast('Giật sớm quá, cá chưa cắn câu!');F=null;return}
  if(F.st==='bite'){const k=pickFish(F.where),d=FISH[k].junk?.1:FISH[k].diff;const zw=Math.max(.1,.42-d*.32+(S.up.rodPro?.08:0));
    F.st='reel';F.k=k;F.pos=0;F.vel=1;F.speed=.7+d*1.6;F.zw=zw;F.zc=zw/2+Math.random()*(1-zw);F.t=4;SFX.splash();return}
  if(F.st==='reel'){
    if(Math.abs(F.pos-F.zc)<=F.zw/2){const k=F.k;addInv(k);S.stats.fish++;SFX.harvest();addFloat(P.x,P.y-20,iconOf(k),'+1');
      gainXp(FISH[k].junk?1:Math.round(FISH[k].sell/8)+3);toast(FISH[k].junk?'👡 Ơ… câu được chiếc dép cũ!':`🎣 Câu được ${FISH[k].n}!${FISH[k].rare?' Hiếm lắm đó!':''}`)}
    else{toast('🐟 Cá giãy thoát mất rồi!');SFX.err()}
    F=null}
}
function updateFish(dt){
  if(!F)return;F.bob+=dt;
  if(F.st==='wait'){F.t-=dt;if(F.t<=0){F.st='bite';F.t=.9;SFX.bite()}}
  else if(F.st==='bite'){F.t-=dt;if(F.t<=0){toast('Cá rỉa mồi rồi bỏ đi mất…');F=null}}
  else if(F.st==='reel'){F.pos+=F.vel*F.speed*dt;if(F.pos>1){F.pos=1;F.vel=-1}if(F.pos<0){F.pos=0;F.vel=1}F.t-=dt;if(F.t<=0){toast('🐟 Cá kéo đứt dây mất rồi!');SFX.err();F=null}}
}

/* ---- Đường đi ---- */
function findPath(sx,sy,tx,ty){
  const goalWalk=!blocked(tx,ty);
  const isGoal=(x,y)=>goalWalk?(x===tx&&y===ty):(Math.abs(x-tx)+Math.abs(y-ty)===1);
  const prev=new Int32Array(MW*MH).fill(-1);const q=[idx(sx,sy)];prev[q[0]]=q[0];
  for(let h=0;h<q.length;h++){const cur=q[h],x=cur%MW,y=cur/MW|0;
    if(isGoal(x,y)){const path=[];let c=cur;while(c!==idx(sx,sy)){path.unshift({x:c%MW,y:c/MW|0});c=prev[c]}return path}
    for(const[dx,dy]of DIRV){const nx=x+dx,ny=y+dy;if(blocked(nx,ny))continue;const ni=idx(nx,ny);if(prev[ni]!==-1)continue;prev[ni]=cur;q.push(ni)}}
  return null;
}
function faceTo(tx,ty){const p=ptile(),dx=tx-p.x,dy=ty-p.y;if(!dx&&!dy)return;if(Math.abs(dx)>Math.abs(dy))P.dir=dx>0?2:3;else P.dir=dy>0?0:1}
let tapMark=null;
function handleTap(tx,ty){
  if(!inMap(tx,ty))return;const p=ptile();
  const npc=npcAt(tx,ty);if(npc){const e=NE[npc];tx=Math.floor(e.x/T);ty=Math.floor((e.y-3)/T)}
  if(Math.max(Math.abs(tx-p.x),Math.abs(ty-p.y))<=1){P.path=null;faceTo(tx,ty);doAction(tx,ty);return}
  const path=findPath(p.x,p.y,tx,ty);
  if(!path){SFX.err();return}
  const o=S.obj[idx(tx,ty)];
  P.path=path;P.pathTarget=([5,6,7,10,11,12,8].includes(o)||npc)?{x:tx,y:ty}:(blocked(tx,ty)?{x:tx,y:ty,face:1}:null);
  tapMark={x:tx,y:ty,t:.5};
}

/* ---- Ngày mới ---- */
function newDay(passOut){
  const msgs=[];
  if(passOut){const lost=Math.min(300,Math.round(S.money*.1));S.money-=lost;msgs.push(`😵 Bạn ngất xỉu lúc 2 giờ sáng! Hàng xóm đưa về nhà, tốn ${fmt(lost)} xu tiền thuốc.`)}
  const prevSs=seasonOf(S.day);
  S.day++;S.min=DAY_START;S.lateWarn=0;
  const ss=seasonOf(S.day);
  S.weather=S.tomorrow;const pr=[.25,.2,.3,.3][ss];S.tomorrow=Math.random()<pr?(ss===3?'snow':'rain'):'sun';
  if(ss===3&&S.weather==='rain')S.weather='snow';if(ss!==3&&S.weather==='snow')S.weather='rain';
  let grown=0;
  for(const k in S.soil){const s=S.soil[k];
    if(s.c&&s.w){const was=isMature(s.c);s.c.a++;if(!was&&isMature(s.c))grown++}
    if(!s.c&&!s.w&&Math.random()<.15){const[x,y]=k.split(',').map(Number);S.ground[idx(x,y)]=0;delete S.soil[k];continue}
    s.w=S.weather!=='sun'?1:0}
  if(ss!==prevSs){
    const dead={};for(const k in S.soil){const s=S.soil[k];if(s.c&&!CROPS[s.c.t].ss.includes(ss)){dead[CROPS[s.c.t].n]=(dead[CROPS[s.c.t].n]||0)+1;s.c=null}}
    msgs.push(`${SEASONS[ss].i} Mùa ${SEASONS[ss].n} bắt đầu! Tiệm Cô Ba có hạt giống mới.`);
    const d=Object.entries(dead).map(([n,c])=>c+' '+n);if(d.length)msgs.push('🥀 Cây trái mùa đã héo: '+d.join(', '));
  }
  if(S.day>=4){
    const sc=Object.keys(S.pl).filter(k=>S.pl[k].k==='bunhin').map(k=>k.split(',').map(Number));const vuln=[];
    for(const k in S.soil){const s=S.soil[k];if(!s.c)continue;const[x,y]=k.split(',').map(Number);if(!sc.some(([a,b])=>(a-x)**2+(b-y)**2<=36))vuln.push(k)}
    if(vuln.length>=5){let n=Math.random()<.65?1+(Math.random()<.35?1:0):0;const eaten=[];
      while(n-->0&&vuln.length){const k=vuln.splice(Math.random()*vuln.length|0,1)[0];eaten.push(CROPS[S.soil[k].c.t].n);S.soil[k].c=null}
      if(eaten.length)msgs.push(`🐦‍⬛ Đêm qua quạ đã ăn mất: ${eaten.join(', ')}. Dựng bù nhìn để bảo vệ ruộng!`)}}
  const zones=[[FIELD.x+1,FIELD.y+1,FIELD.x+FIELD.w-2,FIELD.y+FIELD.h-2]];if(S.built.south)zones.push([SOUTH.x0,SOUTH.y0,SOUTH.x1,SOUTH.y1]);
  for(const[x0,y0,x1,y1]of zones){let w=2+(Math.random()*3|0);
    for(let tries=0;tries<60&&w>0;tries++){const x=x0+(Math.random()*(x1-x0+1)|0),y=y0+(Math.random()*(y1-y0+1)|0),i=idx(x,y);if(S.ground[i]===0&&S.obj[i]===0){S.obj[i]=4;w--}}}
  let hungry=0,eggs=0,milk=0;const free=penTiles().filter(([x,y])=>dropAt(x,y)<0);
  for(const a of S.animals){
    if(!a.pet)a.f=Math.max(0,a.f-8);a.pet=0;
    if(S.hay>0){S.hay--;a.f=Math.min(1000,a.f+5);
      if(a.k==='ga'&&free.length){const[x,y]=free.splice(Math.random()*free.length|0,1)[0];S.drops.push({x,y,k:Math.random()<a.f/1000*.6?'trungto':'trung'});eggs++}
      if(a.k==='bo'){a.milk=1;milk++}}
    else{hungry++;a.f=Math.max(0,a.f-20)}}
  if(eggs||milk)msgs.push(`🐣 Sáng nay: ${eggs?eggs+' quả trứng':''}${eggs&&milk?', ':''}${milk?milk+' con bò có sữa':''}.`);
  if(hungry)msgs.push(`😢 ${hungry} con vật bị đói vì hết cỏ khô! Mua thêm ở chuồng hoặc tiệm Cô Ba.`);
  for(const id in S.npc){S.npc[id].talk=0;S.npc[id].gift=0}
  if(S.quest&&S.day>S.quest.until){msgs.push(`⌛ Hết hạn giúp ${NPCS[S.quest.id].n} rồi…`);addFriend(S.quest.id,-3);S.quest=null}
  if(!S.quest&&Math.random()<.55){const m=newQuest();if(m)msgs.push(m)}
  S.energy=passOut?Math.round(S.maxE*.5):S.maxE;
  S.px=DOOR.x*T+8;S.py=DOOR.y*T+12;P.x=S.px;P.y=S.py;P.dir=0;P.path=null;F=null;
  if(S.weather==='rain')msgs.push('🌧️ Trời mưa – ruộng đã được tưới tự động.');
  if(S.weather==='snow')msgs.push('🌨️ Tuyết rơi – đất ẩm, không cần tưới hôm nay.');
  if(grown)msgs.push(`🌾 Có ${grown} cây vừa chín, ra thu hoạch thôi!`);
  const done=Object.values(S.pl).filter(p=>p.job&&absNow()>=p.job.ready).length;if(done)msgs.push(`⚙️ ${done} máy chế biến đã làm xong hàng.`);
  syncAnimals();save();
  return msgs;
}

    S.animals.push({id:S.aid++,k,name:nm,f:0,pet:0,milk:0});syncAnimals();SFX.coin();k==='ga'?SFX.cluck():SFX.moo();toast(`🎉 Chào mừng ${nm} về nông trại!`);openAnimals(k)}

    if(k==='coop'||k==='barn'){const R0=k==='coop'?COOP:BARN;for(let y=R0.y;y<R0.y+R0.h;y++)for(let x=R0.x;x<R0.x+R0.w;x++){const i=idx(x,y);if(S.obj[i]===8){addItem(S.pl[x+','+y].k);delete S.pl[x+','+y]}if(S.soil[x+','+y]){delete S.soil[x+','+y];S.ground[i]=0}S.drops=S.drops.filter(d=>!(d.x===x&&d.y===y))}}
    S.money-=p;S.built[k]=1;unlockArea(S,k);if(k==='coop')S.hay+=10;syncAnimals();SFX.lvl();
    toast({coop:'🐔 Chuồng gà đã xong! Chạm vào chuồng để mua gà.',barn:'🐄 Chuồng bò đã xong! Chạm vào chuồng để mua bò.',south:'🌿 Khu đất phía Nam đã mở!',east:'🏞️ Lối ra suối phía Đông đã mở!'}[k]);save();renderWork()}

    if(F.st==='bite'){R(cx,'#4e2c12',x-3,y-33,7,11);R(cx,'#fff6d8',x-2,y-32,5,9);R(cx,'#e0583c',x,y-31,1,5);R(cx,'#e0583c',x,y-25,1,1);
      for(let i=0;i<3;i++)R(cx,'#bfe6f7',bx-4+i*4,by+3,2,1)}}
  for(const p of parts){cx.fillStyle=p.c;cx.fillRect(Math.round(p.x),Math.round(p.y),1,1)}
  for(const b of bflies){if(b.night){cx.fillStyle=`rgba(255,250,150,${.5+.5*Math.sin(b.t*4)})`;cx.fillRect(Math.round(b.x),Math.round(b.y),1,1)}
    else if(S.weather==='sun'&&!b.hide){const f=Math.floor(b.t*8)%2;cx.fillStyle=b.c;cx.fillRect(Math.round(b.x)-1,Math.round(b.y),f?1:2,f?2:1);cx.fillRect(Math.round(b.x)+1,Math.round(b.y),f?1:2,f?2:1)}}
  for(const f of floats){const y=f.y-f.t*16,al=Math.min(1,(1.1-f.t)*3);cx.globalAlpha=al;cx.drawImage(f.img,Math.round(f.x-(f.txt?12:5)),Math.round(y-8),10,10);
    if(f.txt){cx.font='bold 8px system-ui,sans-serif';cx.fillStyle='#000';cx.fillText(f.txt,Math.round(f.x-1),Math.round(y+1));cx.fillStyle='#fff';cx.fillText(f.txt,Math.round(f.x-2),Math.round(y))}cx.globalAlpha=1}
  const m=S.min;let dark=0;if(m<7*60)dark=.25*(1-(m-DAY_START)/60);else if(m>17.5*60)dark=Math.min(.55,(m-17.5*60)/(3.5*60)*.55);
  cx.setTransform(1,0,0,1,0,0);
  if(S.weather==='rain'){cx.fillStyle='rgba(40,55,80,.22)';cx.fillRect(0,0,view.w,view.h)}
  if(S.weather==='snow'){cx.fillStyle='rgba(200,215,235,.12)';cx.fillRect(0,0,view.w,view.h)}

    if(dark>.15){cx.setTransform(1,0,0,1,-cam.x,-cam.y);const a=Math.min(.95,dark*1.8);cx.fillStyle=`rgba(255,214,110,${a})`;
      [12,54].forEach(x=>cx.fillRect(HOUSE.x*T+x+1,HOUSE.y*T-18+50,13,11));

    else{cx.fillStyle='rgba(190,220,255,.6)';for(const r of rainDrops)cx.fillRect(Math.round(r.x),Math.round(r.y),1,4)}}
  if(F&&F.st==='reel'){const w=Math.min(120,view.w-40),bx=Math.round((view.w-w)/2),by=Math.round(view.h*.6);
    R(cx,'#4e2c12',bx-3,by-3,w+6,16);R(cx,'#2a1a10',bx,by,w,10);R(cx,'#7fc24a',bx+Math.round((F.zc-F.zw/2)*w),by,Math.round(F.zw*w),10);
    R(cx,'#ffffff',bx+Math.round(F.pos*(w-2)),by-2,2,14);R(cx,'#e0583c',bx,by+11,Math.round(w*F.t/4),2);
    cx.drawImage(ICON.rod,bx-20,by-3);cx.font='bold 8px system-ui,sans-serif';cx.fillStyle='#000';cx.fillText('Bấm khi vạch trắng vào vùng xanh!',bx+1,by-5);cx.fillStyle='#fff';cx.fillText('Bấm khi vạch trắng vào vùng xanh!',bx,by-6)}
}
function drawPl(x,y,p){

    if(a.milk){const by=y-24+Math.round(Math.sin(tAll*4));R(cx,'#ffffff',x-1,by,3,4);R(cx,'#4fa3e0',x-1,by+2,3,1)}}

function drawPlayer(){
  const d=P.dir,sd=d>=2?2:d,f=P.moving?1+(Math.floor(P.anim*8)%2):0,img=CSPR.player[sd][f];

    if(d===3)cx.scale(-1,1);cx.rotate((d===3?-1:1)*(k-.5)*1.2*(d===1?-1:1));cx.drawImage(ti,-8,-8);cx.restore()};

/* ================= HUD ================= */
let hudT=0;
function hud(){
  const ss=seasonOf(S.day),wi={sun:'☀️',rain:'🌧️',snow:'🌨️'}[S.weather];
  $('#hDay').textContent=`${SEASONS[ss].i} ${SEASONS[ss].n} ${sDay(S.day)} · Năm ${yearOf(S.day)}`;
  $('#hTime').textContent=`🕒 ${fmtTime(S.min)} ${wi}`;
  $('#hLv').textContent='⭐ Cấp '+S.lv;$('#hXp').textContent=`${S.xp}/${xpNeed(S.lv)}`;
  $('#xpBar').style.width=(S.xp/xpNeed(S.lv)*100)+'%';
  $('#hMoney').textContent='💰 '+fmt(S.money);
  $('#hE').textContent=`${Math.round(S.energy)}/${S.maxE}`;$('#eBar').style.width=(S.energy/S.maxE*100)+'%';
  $('#hW').textContent=`${S.water}/${canCap()}`;$('#wBar').style.width=(S.water/canCap()*100)+'%';
  $('#bBag').classList.toggle('has',!!S.quest);

}
